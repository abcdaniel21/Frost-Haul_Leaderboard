    // ── HELPERS ──────────────────────────────────────────────────────

    function getLevelInfo(xp) {
      let current = LEVELS[0], next = LEVELS[1];
      for (let i = 0; i < LEVELS.length; i++) {
        if (xp >= LEVELS[i].xp) { current = LEVELS[i]; next = LEVELS[i + 1] || null; }
      }
      const progress = next ? Math.round(((xp - current.xp) / (next.xp - current.xp)) * 100) : 100;
      return { current, next, progress };
    }

    function initData() {
      const initial = {};
      TEAM.forEach(m => { initial[m.name] = { xp: 0, classId: null, achievements: [] }; });
      return initial;
    }

    // ── COMPONENT ────────────────────────────────────────────────────

    function LastCarRPG() {

      // ═══════════════════════════════════════════════════════════════
      // CHANGE 4 OF 6 — Admin mode state
      // isAdmin starts false for everyone. The lock button in the
      // header calls handleAdminToggle() to authenticate.
      // ═══════════════════════════════════════════════════════════════
      const [isAdmin, setIsAdmin] = useState(false);

      const handleAdminToggle = () => {
        if (isAdmin) {
          // Already admin — log out
          setIsAdmin(false);
          setSavedMsg("Admin mode off");
          setTimeout(() => setSavedMsg(""), 2000);
        } else {
          // Prompt for password using the browser's built-in dialog
          const pw = window.prompt("Enter admin password:");
          if (pw === ADMIN_PASSWORD) {
            setIsAdmin(true);
            setSavedMsg("Admin mode on ✓");
            setTimeout(() => setSavedMsg(""), 2000);
          } else if (pw !== null) {
            // pw === null means the user clicked Cancel — do nothing
            alert("Incorrect password.");
          }
        }
      };

      // ═══════════════════════════════════════════════════════════════
      // CHANGE 5 OF 6 — Load data from Firestore instead of localStorage
      //
      // onSnapshot sets up a real-time listener. Every time the
      // Firestore document is updated (by you, the admin), ALL open
      // browser tabs receive the new data automatically — no page
      // refresh needed.
      //
      // The function returned by onSnapshot is the unsubscribe handle.
      // Returning it from useEffect means React calls it on unmount,
      // which is correct cleanup behaviour.
      // ═══════════════════════════════════════════════════════════════
      useEffect(() => {
        const unsubscribe = FS_DOC.onSnapshot(
          (snap) => {
            if (snap.exists) {
              // Document found — use the stored data
              setMemberData(snap.data());
            } else {
              // First ever load: document doesn't exist yet.
              // Write the initial blank state so it appears in Firestore.
              const blank = initData();
              FS_DOC.set(blank).catch(console.error);
              setMemberData(blank);
            }
            setLoading(false);
          },
          (error) => {
            // If Firestore is unreachable (e.g. bad config), fall back
            // gracefully so the page at least renders.
            console.error("Firestore error:", error);
            setMemberData(initData());
            setLoading(false);
          }
        );

        // Unsubscribe when the component unmounts
        return () => unsubscribe();
      }, []);

      // ═══════════════════════════════════════════════════════════════
      // CHANGE 6 OF 6 — Save to Firestore instead of localStorage
      //
      // FS_DOC.set(data) overwrites the entire document with the new
      // state. Because onSnapshot is listening, every viewer tab will
      // receive the update within ~1 second automatically.
      // ═══════════════════════════════════════════════════════════════
      const save = useCallback((data) => {
        FS_DOC.set(data)
          .then(() => {
            setSavedMsg("Saved ✓");
            setTimeout(() => setSavedMsg(""), 2000);
          })
          .catch((err) => {
            console.error(err);
            setSavedMsg("Save failed ✗");
            setTimeout(() => setSavedMsg(""), 3000);
          });
      }, []);

      // ── These three action handlers are unchanged in logic.
      //    They now call the new Firestore-backed save() above.

        const updated = { ...memberData, [name]: { ...memberData[name], xp: Math.max(0, parseInt(newXP) || 0) } };

        save(updated);
        setEditingXP(null);

        save(updated);

            ::-webkit-scrollbar-track { background: #1A1A1A; }

            .tab-btn:hover { color: #D4A843; border-color: #6B4F12; }

            .ach-card.unlocked { border-color: #8B6914; background: #1A1208; }

            .admin-btn.off { border-color: #3A3020; background: transparent; color: #4A3820; }
            .admin-btn.off:hover { border-color: #6B4F12; color: #8B7355; }
            .admin-btn.on { border-color: #D4A843; background: #1E1608; color: #D4A843; }
          `}</style>

          {/* ── HEADER ── */}

                        const rankCls = idx === 0 ? "rank-1" : idx === 1 ? "rank-2" : idx === 2 ? "rank-3" : "";
                        return (
                          <div key={member.name} className="card" style={{ padding: "14px 16px", display: "grid", gridTemplateColumns: "36px 1fr auto", alignItems: "center", gap: "16px" }}>
                            <div style={{ fontFamily: "'Cinzel',serif", fontSize: "20px", fontWeight: 700, textAlign: "center" }} className={rankCls}>
                              {idx === 0 ? "👑" : idx === 1 ? "⚔️" : idx === 2 ? "🏹" : `${idx + 1}`}
                            </div>
                            <div>
                              <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "4px", flexWrap: "wrap" }}>
                                {cls && <span style={{ fontSize: "16px" }}>{cls.icon}</span>}
                                <span style={{ fontFamily: "'Cinzel',serif", fontSize: "14px", color: "#E8DCC8" }}>{member.name}</span>
                                <span style={{ fontFamily: "'Crimson Text',serif", fontSize: "12px", color: "#6B4F12" }}>{member.role}</span>
                                {cls && <span style={{ fontFamily: "'Cinzel',serif", fontSize: "10px", padding: "1px 8px", border: `1px solid ${cls.color}40`, color: cls.color, borderRadius: "2px" }}>{cls.name}</span>}
                              </div>
                              <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                                <span style={{ fontFamily: "'Cinzel',serif", fontSize: "11px", color: "#D4A843", whiteSpace: "nowrap" }}>Lv.{current.level} {current.title}</span>
                                <div className="xp-bar-bg" style={{ flex: 1 }}>
                                  <div className="xp-bar-fill" style={{ width: `${progress}%` }} />
                                </div>
                                <span style={{ fontFamily: "'Crimson Text',serif", fontSize: "12px", color: "#8B7355", whiteSpace: "nowrap" }}>
                                  {next ? `${data.xp} / ${next.xp} XP` : `${data.xp} XP — MAX`}
                                </span>
                              </div>
                              {data.achievements?.length > 0 && (
                                <div style={{ marginTop: "5px", display: "flex", gap: "4px", flexWrap: "wrap" }}>
                                  {data.achievements.map(achId => {
                                    const ach = ACHIEVEMENTS.find(a => a.id === achId);
                                    return ach ? <span key={achId} title={ach.name} style={{ fontSize: "14px" }}>{ach.icon}</span> : null;
                                  })}
                                </div>
                              )}
                            </div>

                            {/* ── Right column: XP display + admin-only edit controls ── */}
                            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "6px" }}>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "18px", color: "#D4A843", fontWeight: 700 }}>
                                {data.xp} <span style={{ fontSize: "11px", color: "#6B4F12" }}>XP</span>
                              </div>

                              {/* Edit controls — only rendered when isAdmin is true */}
                              {isAdmin && (
                                editingXP === member.name ? (
                                  <div style={{ display: "flex", gap: "6px" }}>
                                    <input className="edit-input" value={xpInput} onChange={e => setXpInput(e.target.value)} onKeyDown={e => e.key === "Enter" && updateXP(member.name, xpInput)} autoFocus placeholder="XP" />
                                    <button className="btn btn-primary" onClick={() => updateXP(member.name, xpInput)}>Set</button>
                                    <button className="btn" onClick={() => setEditingXP(null)}>✕</button>
                                  </div>
                                ) : (
                                  <div style={{ display: "flex", gap: "6px" }}>
                                    <button className="btn" onClick={() => { setEditingXP(member.name); setXpInput(String(data.xp)); }}>Edit XP</button>
                                    <button className="btn" onClick={() => { setClassTarget(member.name); setTab("classes"); }}>{cls ? "Change class" : "Pick class"}</button>
                                  </div>
                                )
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {/* Info box — shows different text for admin vs viewer */}
                    <div style={{ marginTop: "20px", padding: "12px 16px", background: "#0A0800", border: "1px solid #2C2210", borderRadius: "4px" }}>
                      {isAdmin ? (
                        <>
                          <div style={{ fontFamily: "'Cinzel',serif", fontSize: "10px", color: "#6B4F12", letterSpacing: "0.08em", marginBottom: "8px" }}>HOW TO UPDATE XP</div>
                          <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#8B7355", lineHeight: "1.7" }}>
                            Click <span className="gold">Edit XP</span> next to a crew member to set their total after each sprint. Calculate using the XP System tab. Update every Friday after the retrospective. Data is saved to the cloud automatically.
                          </div>
                        </>
                      ) : (
                        <>
                          <div style={{ fontFamily: "'Cinzel',serif", fontSize: "10px", color: "#6B4F12", letterSpacing: "0.08em", marginBottom: "8px" }}>CHRONICLES</div>
                          <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#8B7355", lineHeight: "1.7" }}>
                            Standings are updated every Friday after the sprint retrospective. Check back then to see who advanced.
                          </div>
                        </>
                      )}
                    </div>
                  </div>
                )}

                {/* CLASSES */}
                {tab === "classes" && (
                  <div>
                    <div style={{ fontFamily: "'Cinzel',serif", fontSize: "13px", color: "#8B7355", letterSpacing: "0.1em", marginBottom: "8px" }}>✦ CHOOSE YOUR CLASS ✦</div>
                    {/* Class assignment prompt only shown in admin mode */}
                    {isAdmin && classTarget && <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "14px", color: "#D4A843", marginBottom: "16px" }}>Assigning class for: <strong>{classTarget}</strong> — select below then confirm.</div>}
                    {!classTarget && <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "14px", color: "#8B7355", marginBottom: "16px" }}>Browse all classes. {isAdmin ? <>To assign, go to the Leaderboard and click "Pick class" on a crew member.</> : <>Classes are assigned by the Game Producer. [XP Multiplier Feature not available]</>}</div>}
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(220px,1fr))", gap: "10px" }}>
                      {CLASSES.map(cls => (
                        <div key={cls.id}
                          className={`class-card ${selectedClass === cls.id ? "selected" : ""}`}
                          style={{ borderColor: selectedClass === cls.id ? cls.color : undefined, cursor: isAdmin ? "pointer" : "default" }}
                          onClick={() => isAdmin && setSelectedClass(cls.id)}>
                          <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "8px" }}>
                            <span style={{ fontSize: "24px" }}>{cls.icon}</span>
                            <div>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "13px", color: cls.color }}>{cls.name}</div>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "9px", color: "#4A3820", letterSpacing: "0.05em" }}>{cls.trait.toUpperCase()}</div>
                            </div>
                          </div>
                          <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#8B7355", lineHeight: "1.5", marginBottom: "8px" }}>{cls.desc}</div>
                          <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "12px", color: "#D4A843", padding: "4px 8px", background: "#1A1208", borderRadius: "2px" }}>{cls.bonus}</div>
                          {/* Assignment confirm button only in admin mode */}
                          {isAdmin && classTarget && selectedClass === cls.id && (
                            <button className="btn btn-primary" style={{ marginTop: "10px", width: "100%" }} onClick={() => assignClass(classTarget, cls.id)}>
                              Assign to {classTarget}
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* XP SYSTEM — unchanged, no admin gating needed */}
                {tab === "xp" && (
                  <div>
                    <div style={{ fontFamily: "'Cinzel',serif", fontSize: "13px", color: "#8B7355", letterSpacing: "0.1em", marginBottom: "20px" }}>✦ XP & ADVANCEMENT ✦</div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "20px" }}>
                      <div>
                        <div style={{ fontFamily: "'Cinzel',serif", fontSize: "11px", color: "#6B4F12", letterSpacing: "0.08em", marginBottom: "10px" }}>TICKET SIZE → BASE XP</div>
                        <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
                          {XP_TABLE.map(row => (
                            <div key={row.size} className="card" style={{ padding: "10px 14px", display: "grid", gridTemplateColumns: "40px 80px 60px 1fr", alignItems: "center", gap: "10px" }}>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "14px", color: "#D4A843", fontWeight: 700 }}>{row.size}</div>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "11px", color: "#E8DCC8" }}>{row.label}</div>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "15px", color: "#D4A843" }}>{row.xp} <span style={{ fontSize: "9px", color: "#6B4F12" }}>XP</span></div>
                              <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "12px", color: "#6B4F12" }}>{row.desc}</div>
                            </div>
                          ))}
                        </div>
                        <div style={{ marginTop: "16px" }}>
                          <div style={{ fontFamily: "'Cinzel',serif", fontSize: "11px", color: "#6B4F12", letterSpacing: "0.08em", marginBottom: "10px" }}>XP MULTIPLIERS & BONUSES - [Feature not available]</div>
                          <div style={{ display: "flex", flexDirection: "column", gap: "5px" }}>
                            {MULTIPLIERS.map((m, i) => (
                              <div key={i} className="card" style={{ padding: "8px 12px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                <span style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#8B7355" }}>{m.label}</span>
                                <span style={{ fontFamily: "'Cinzel',serif", fontSize: "12px", color: m.color, fontWeight: 600 }}>{m.mult}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                      <div>
                        <div style={{ fontFamily: "'Cinzel',serif", fontSize: "11px", color: "#6B4F12", letterSpacing: "0.08em", marginBottom: "10px" }}>LEVEL THRESHOLDS</div>
                        <div style={{ display: "flex", flexDirection: "column", gap: "5px" }}>
                          {LEVELS.map((lv, i) => (
                            <div key={lv.level} className="card" style={{ padding: "8px 14px", display: "grid", gridTemplateColumns: "32px 1fr auto", alignItems: "center", gap: "10px" }}>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "12px", color: "#6B4F12" }}>Lv.{lv.level}</div>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "12px", color: i === 9 ? "#D4A843" : "#E8DCC8" }}>{lv.title}</div>
                              <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#D4A843" }}>{lv.xp === 0 ? "—" : `${lv.xp} XP`}</div>
                            </div>
                          ))}
                        </div>
                        <div className="card" style={{ padding: "14px", marginTop: "16px" }}>
                          <div style={{ fontFamily: "'Cinzel',serif", fontSize: "11px", color: "#6B4F12", letterSpacing: "0.08em", marginBottom: "8px" }}>EXAMPLE SPRINT CALC</div>
                          <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#8B7355", lineHeight: "1.8" }}>
                            3× M tickets = 180 XP<br />
                            1× L Main Quest = 120 × 1.20 = <span className="gold">144 XP</span><br />
                            On-time bonus = 144 × 1.15 = <span className="gold">165 XP</span><br />
                            Standup streak = +10 flat<br />
                            <hr style={{ borderColor: "#2C2210", margin: "8px 0" }} />
                            <span className="gold" style={{ fontFamily: "'Cinzel',serif" }}>Total: ~355 XP</span> in one sprint<br />
                            <span style={{ fontSize: "11px", color: "#4A3820" }}>That's Lv.2 → Lv.3 in one strong sprint.</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* QUEST TYPES — unchanged */}
                {tab === "quests" && (
                  <div>
                    <div style={{ fontFamily: "'Cinzel',serif", fontSize: "13px", color: "#8B7355", letterSpacing: "0.1em", marginBottom: "20px" }}>✦ QUEST TYPES & JIRA LABELS ✦</div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(280px,1fr))", gap: "12px" }}>
                      {QUEST_TYPES.map(q => (
                        <div key={q.type} className="quest-card" style={{ borderLeft: `3px solid ${q.color}` }}>
                          <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "10px" }}>
                            <span style={{ fontSize: "22px" }}>{q.icon}</span>
                            <span style={{ fontFamily: "'Cinzel',serif", fontSize: "14px", color: q.color }}>{q.type}</span>
                          </div>
                          <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#8B7355", lineHeight: "1.6", marginBottom: "10px" }}>{q.desc}</div>
                          <div style={{ background: "#1A1208", border: "1px solid #2C2210", borderRadius: "2px", padding: "6px 10px", marginBottom: "10px" }}>
                            <div style={{ fontFamily: "'Cinzel',serif", fontSize: "9px", color: "#6B4F12", letterSpacing: "0.06em", marginBottom: "3px" }}>JIRA CONFIG</div>
                            <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "12px", color: "#D4A843" }}>{q.jira}</div>
                          </div>
                          <div style={{ fontFamily: "'Cinzel',serif", fontSize: "9px", color: "#6B4F12", letterSpacing: "0.06em", marginBottom: "5px" }}>EXAMPLES</div>
                          {q.examples.map((ex, i) => (
                            <div key={i} style={{ fontFamily: "'Crimson Text',serif", fontSize: "12px", color: "#6B4F12", padding: "2px 0", borderBottom: "1px solid #1A140A" }}>· {ex}</div>
                          ))}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* ACHIEVEMENTS */}
                {tab === "achievements" && (
                  <div>
                    <div style={{ fontFamily: "'Cinzel',serif", fontSize: "13px", color: "#8B7355", letterSpacing: "0.1em", marginBottom: "8px" }}>✦ DEEDS & HONOURS ✦</div>
                    <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#6B4F12", marginBottom: "16px" }}>
                      {isAdmin
                        ? "Click an achievement to mark it as earned. XP is added automatically."
                        : "Achievements earned by each crew member during the campaign."}
                    </div>
                    {sorted.map(member => {
                      const data   = memberData[member.name] || { xp: 0, classId: null, achievements: [] };
                      const earned = data.achievements || [];
                      return (
                        <div key={member.name} style={{ marginBottom: "20px" }}>
                          <div style={{ fontFamily: "'Cinzel',serif", fontSize: "12px", color: "#D4A843", letterSpacing: "0.06em", marginBottom: "8px", display: "flex", alignItems: "center", gap: "10px" }}>
                            {member.name}
                            <span style={{ fontSize: "10px", color: "#6B4F12" }}>{earned.length}/{ACHIEVEMENTS.length} unlocked</span>
                          </div>
                          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(220px,1fr))", gap: "6px" }}>
                            {ACHIEVEMENTS.map(ach => {
                              const isEarned = earned.includes(ach.id);
                              return (
                                <div key={ach.id}
                                  className={`ach-card ${isEarned ? "unlocked" : ""} ${isAdmin ? "clickable" : ""}`}
                                  onClick={() => isAdmin && toggleAchievement(member.name, ach.id)}
                                  style={{ opacity: isEarned ? 1 : 0.5 }}>
                                  <span style={{ fontSize: "20px", flexShrink: 0 }}>{ach.icon}</span>
                                  <div style={{ flex: 1 }}>
                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "2px" }}>
                                      <span style={{ fontFamily: "'Cinzel',serif", fontSize: "11px", color: isEarned ? "#D4A843" : "#8B7355" }}>{ach.name}</span>
                                      <span style={{ fontFamily: "'Cinzel',serif", fontSize: "10px", color: rarityColor[ach.rarity], textTransform: "uppercase" }}>{ach.rarity}</span>
                                    </div>
                                    <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "11px", color: "#6B4F12", lineHeight: "1.3" }}>{ach.desc}</div>
                                    {ach.xp > 0 && <div style={{ fontFamily: "'Cinzel',serif", fontSize: "10px", color: "#D4A843", marginTop: "3px" }}>+{ach.xp} XP</div>}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    // ── MOUNT ────────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<LastCarRPG />);
  </script>
</body>
</html>
