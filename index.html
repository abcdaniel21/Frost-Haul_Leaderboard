      { name: "Bartosz",  role: "Artist"         },
      { name: "Louis",    role: "Artist"         },
      { name: "Emely",    role: "Artist"         },
      { name: "Allan",    role: "Programmer"     },

    // ── HELPERS ──────────────────────────────────────────────────────

    function getLevelInfo(xp) {
      let current = LEVELS[0], next = LEVELS[1];
      for (let i = 0; i < LEVELS.length; i++) {
        if (xp >= LEVELS[i].xp) { current = LEVELS[i]; next = LEVELS[i + 1] || null; }
      }
      const progress = next ? Math.round(((xp - current.xp) / (next.xp - current.xp)) * 100) : 100;
      return { current, next, progress };
    }

    const rarityColor = { common: "#94A3B8", uncommon: "#2ECC71", rare: "#3498DB", epic: "#A965E2", legendary: "#E67E22" };

    function initData() {
      const initial = {};
      TEAM.forEach(m => { initial[m.name] = { xp: 0, classId: null, achievements: [] }; });
      return initial;
    }

    // ── COMPONENT ────────────────────────────────────────────────────

    function LastCarRPG() {
      const [tab, setTab]               = useState("leaderboard");
      const [memberData, setMemberData] = useState({});
      const [loading, setLoading]       = useState(true);
      const [editingXP, setEditingXP]   = useState(null);
      const [xpInput, setXpInput]       = useState("");
      const [selectedClass, setSelectedClass] = useState(null);
      const [classTarget, setClassTarget]     = useState(null);
      const [savedMsg, setSavedMsg]     = useState("");
      const [isAdmin, setIsAdmin]       = useState(false);

      // ═══════════════════════════════════════════════════════════════
      //  isAdmin is driven by Firebase Auth.//
      const [isAdmin,        setIsAdmin       ] = useState(false);
      const [showLoginForm,  setShowLoginForm ] = useState(false);
      const [loginEmail,     setLoginEmail    ] = useState("");
      const [loginPassword,  setLoginPassword ] = useState("");
      const [loginError,     setLoginError    ] = useState("");
      const [loginLoading,   setLoginLoading  ] = useState(false);
 
      // Sync isAdmin with Firebase Auth session on every page load
      useEffect(() => {
        const unsub = auth.onAuthStateChanged(user => {
          setIsAdmin(!!user);  // true if logged in, false if not
        });
        return () => unsub();
      }, []);
 
      const handleLogin = async () => {
        setLoginError("");
        setLoginLoading(true);
        try {
          await auth.signInWithEmailAndPassword(loginEmail, loginPassword);
          // onAuthStateChanged above will set isAdmin = true automatically
          setShowLoginForm(false);
          setLoginEmail("");
          setLoginPassword("");
          setSavedMsg("Admin mode on ✓");
          setTimeout(() => setSavedMsg(""), 2000);
        } catch (err) {
         

    // ═══════════════════════════════════════════════════════════════
    // Load data from Firestore instead of localStorage //
      useEffect(() => {
        const unsubscribe = FS_DOC.onSnapshot(
          (snap) => {
            if (snap.exists) {
              setMemberData(snap.data());
            } else {
              const blank = initData();
              FS_DOC.set(blank).catch(console.error);
              setMemberData(blank);
            }
            setLoading(false);
          },
          (error) => {
            console.error("Firestore error:", error);
            setMemberData(initData());
            setLoading(false);
          }
        );
        return () => unsubscribe();
      }, []);

      const save = useCallback((data) => {
        FS_DOC.set(data)
          .then(() => {
            setSavedMsg("Saved ✓");
            setTimeout(() => setSavedMsg(""), 2000);
          })
          .catch((err) => {
            console.error(err);
            setSavedMsg("Save failed ✗");
            setTimeout(() => setSavedMsg(""), 3000);
          });
      }, []);

      const updateXP = (name, newXP) => {
        const updated = { ...memberData, [name]: { ...memberData[name], xp: Math.max(0, parseInt(newXP) || 0) } };
        setMemberData(updated);
        save(updated);
        setEditingXP(null);
      };

      const assignClass = (name, classId) => {
        const updated = { ...memberData, [name]: { ...memberData[name], classId } };
        setMemberData(updated);
        save(updated);
        setClassTarget(null);
        setSelectedClass(null);

        const current    = memberData[name]?.achievements || [];
        const isEarned   = current.includes(achId);
        const updatedAch = isEarned ? current.filter(a => a !== achId) : [...current, achId];

        setMemberData(updated);
        save(updated);

                <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "14px", color: "#7A93A6", marginTop: "2px" }}>Production RPG · Sprint Tracking · Crew Advancement</div>

              <div style={{ textAlign: "right", display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "6px" }}>

                            </div>

                            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "6px" }}>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "18px", color: "#58C7EB", fontWeight: 700 }}>
                                {data.xp} <span style={{ fontSize: "11px", color: "#465E75" }}>XP</span>
                              </div>

                              {isAdmin && (
                                editingXP === member.name ? (
                                  <div style={{ display: "flex", gap: "6px" }}>
                                    <input className="edit-input" value={xpInput} onChange={e => setXpInput(e.target.value)} onKeyDown={e => e.key === "Enter" && updateXP(member.name, xpInput)} autoFocus placeholder="XP" />
                                    <button className="btn btn-primary" onClick={() => updateXP(member.name, xpInput)}>Set</button>
                                    <button className="btn" onClick={() => setEditingXP(null)}>✕</button>
                                  </div>
                                ) : (
                                  <div style={{ display: "flex", gap: "6px" }}>
                                    <button className="btn" onClick={() => { setEditingXP(member.name); setXpInput(String(data.xp)); }}>Edit XP</button>
                                    <button className="btn" onClick={() => { setClassTarget(member.name); setTab("classes"); }}>{cls ? "Change class" : "Pick class"}</button>
                                  </div>
                                )
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    <div style={{ marginTop: "20px", padding: "12px 16px", background: "#0E1520", border: "1px solid #243345", borderRadius: "4px" }}>
                      {isAdmin ? (
                        <>
                          <div style={{ fontFamily: "'Cinzel',serif", fontSize: "10px", color: "#465E75", letterSpacing: "0.08em", marginBottom: "8px" }}>HOW TO UPDATE XP</div>
                          <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#7A93A6", lineHeight: "1.7" }}>
                            Click <span className="gold">Edit XP</span> next to a crew member to set their total after each sprint. Calculate using the XP System tab. Update every Friday after the retrospective. Data is saved to the cloud automatically.
                          </div>
                        </>
                      ) : (
                        <>
                          <div style={{ fontFamily: "'Cinzel',serif", fontSize: "10px", color: "#465E75", letterSpacing: "0.08em", marginBottom: "8px" }}>CHRONICLES</div>
                          <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#7A93A6", lineHeight: "1.7" }}>
                            Standings are updated every Friday after the sprint retrospective. Check back then to see who advanced.
                          </div>
                        </>
                      )}
                    </div>
                  </div>
                )}

                {/* CLASSES */}
                {tab === "classes" && (
                  <div>
                    <div style={{ fontFamily: "'Cinzel',serif", fontSize: "13px", color: "#7A93A6", letterSpacing: "0.1em", marginBottom: "8px" }}>✦ CHOOSE YOUR CLASS ✦</div>
                    {isAdmin && classTarget && <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "14px", color: "#58C7EB", marginBottom: "16px" }}>Assigning class for: <strong>{classTarget}</strong> — select below then confirm.</div>}
                    {!classTarget && <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "14px", color: "#7A93A6", marginBottom: "16px" }}>Browse all classes. {isAdmin ? <>To assign, go to the Leaderboard and click "Pick class" on a crew member.</> : <>Classes are assigned by the Game Producer. [XP Multiplier Feature not available]</>}</div>}
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(220px,1fr))", gap: "10px" }}>
                      {CLASSES.map(cls => (
                        <div key={cls.id}
                          className={`class-card ${selectedClass === cls.id ? "selected" : ""}`}
                          style={{ borderColor: selectedClass === cls.id ? cls.color : undefined, cursor: isAdmin ? "pointer" : "default" }}
                          onClick={() => isAdmin && setSelectedClass(cls.id)}>
                          <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "8px" }}>
                            <span style={{ fontSize: "24px" }}>{cls.icon}</span>
                            <div>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "13px", color: cls.color }}>{cls.name}</div>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "9px", color: "#465E75", letterSpacing: "0.05em" }}>{cls.trait.toUpperCase()}</div>
                            </div>
                          </div>
                          <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#7A93A6", lineHeight: "1.5", marginBottom: "8px" }}>{cls.desc}</div>
                          <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "12px", color: "#58C7EB", padding: "4px 8px", background: "#142132", borderRadius: "2px" }}>{cls.bonus}</div>
                          {isAdmin && classTarget && selectedClass === cls.id && (
                            <button className="btn btn-primary" style={{ marginTop: "10px", width: "100%" }} onClick={() => assignClass(classTarget, cls.id)}>
                              Assign to {classTarget}
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* XP SYSTEM */}
                {tab === "xp" && (
                  <div>
                    <div style={{ fontFamily: "'Cinzel',serif", fontSize: "13px", color: "#7A93A6", letterSpacing: "0.1em", marginBottom: "20px" }}>✦ XP & ADVANCEMENT ✦</div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "20px" }}>
                      <div>
                        <div style={{ fontFamily: "'Cinzel',serif", fontSize: "11px", color: "#465E75", letterSpacing: "0.08em", marginBottom: "10px" }}>TICKET SIZE → BASE XP</div>
                        <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
                          {XP_TABLE.map(row => (
                            <div key={row.size} className="card" style={{ padding: "10px 14px", display: "grid", gridTemplateColumns: "40px 80px 60px 1fr", alignItems: "center", gap: "10px" }}>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "14px", color: "#58C7EB", fontWeight: 700 }}>{row.size}</div>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "11px", color: "#F1F5F9" }}>{row.label}</div>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "15px", color: "#58C7EB" }}>{row.xp} <span style={{ fontSize: "9px", color: "#465E75" }}>XP</span></div>
                              <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "12px", color: "#465E75" }}>{row.desc}</div>
                            </div>
                          ))}
                        </div>
                        <div style={{ marginTop: "16px" }}>
                          <div style={{ fontFamily: "'Cinzel',serif", fontSize: "11px", color: "#465E75", letterSpacing: "0.08em", marginBottom: "10px" }}>XP MULTIPLIERS & BONUSES - [Feature not available]</div>
                          <div style={{ display: "flex", flexDirection: "column", gap: "5px" }}>
                            {MULTIPLIERS.map((m, i) => (
                              <div key={i} className="card" style={{ padding: "8px 12px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                <span style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#7A93A6" }}>{m.label}</span>
                                <span style={{ fontFamily: "'Cinzel',serif", fontSize: "12px", color: m.color, fontWeight: 600 }}>{m.mult}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                      <div>
                        <div style={{ fontFamily: "'Cinzel',serif", fontSize: "11px", color: "#465E75", letterSpacing: "0.08em", marginBottom: "10px" }}>LEVEL THRESHOLDS</div>
                        <div style={{ display: "flex", flexDirection: "column", gap: "5px" }}>
                          {LEVELS.map((lv, i) => (
                            <div key={lv.level} className="card" style={{ padding: "8px 14px", display: "grid", gridTemplateColumns: "32px 1fr auto", alignItems: "center", gap: "10px" }}>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "12px", color: "#465E75" }}>Lv.{lv.level}</div>
                              <div style={{ fontFamily: "'Cinzel',serif", fontSize: "12px", color: i === 9 ? "#58C7EB" : "#F1F5F9" }}>{lv.title}</div>
                              <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#58C7EB" }}>{lv.xp === 0 ? "—" : `${lv.xp} XP`}</div>
                            </div>
                          ))}
                        </div>
                        <div className="card" style={{ padding: "14px", marginTop: "16px" }}>
                          <div style={{ fontFamily: "'Cinzel',serif", fontSize: "11px", color: "#465E75", letterSpacing: "0.08em", marginBottom: "8px" }}>EXAMPLE SPRINT CALC</div>
                          <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#7A93A6", lineHeight: "1.8" }}>
                            3× M tickets = 180 XP<br />
                            1× L Main Quest = 120 × 1.20 = <span className="gold">144 XP</span><br />
                            On-time bonus = 144 × 1.15 = <span className="gold">165 XP</span><br />
                            Standup streak = +10 flat<br />
                            <hr style={{ borderColor: "#243345", margin: "8px 0" }} />
                            <span className="gold" style={{ fontFamily: "'Cinzel',serif" }}>Total: ~355 XP</span> in one sprint<br />
                            <span style={{ fontSize: "11px", color: "#465E75" }}>That's Lv.2 → Lv.3 in one strong sprint.</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* QUEST TYPES */}
                {tab === "quests" && (
                  <div>
                    <div style={{ fontFamily: "'Cinzel',serif", fontSize: "13px", color: "#7A93A6", letterSpacing: "0.1em", marginBottom: "20px" }}>✦ QUEST TYPES & JIRA LABELS ✦</div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(280px,1fr))", gap: "12px" }}>
                      {QUEST_TYPES.map(q => (
                        <div key={q.type} className="quest-card" style={{ borderLeft: `3px solid ${q.color}` }}>
                          <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "10px" }}>
                            <span style={{ fontSize: "22px" }}>{q.icon}</span>
                            <span style={{ fontFamily: "'Cinzel',serif", fontSize: "14px", color: q.color }}>{q.type}</span>
                          </div>
                          <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#7A93A6", lineHeight: "1.6", marginBottom: "10px" }}>{q.desc}</div>
                          <div style={{ background: "#142132", border: "1px solid #243345", borderRadius: "2px", padding: "6px 10px", marginBottom: "10px" }}>
                            <div style={{ fontFamily: "'Cinzel',serif", fontSize: "9px", color: "#465E75", letterSpacing: "0.06em", marginBottom: "3px" }}>JIRA CONFIG</div>
                            <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "12px", color: "#58C7EB" }}>{q.jira}</div>
                          </div>
                          <div style={{ fontFamily: "'Cinzel',serif", fontSize: "9px", color: "#465E75", letterSpacing: "0.06em", marginBottom: "5px" }}>EXAMPLES</div>
                          {q.examples.map((ex, i) => (
                            <div key={i} style={{ fontFamily: "'Crimson Text',serif", fontSize: "12px", color: "#465E75", padding: "2px 0", borderBottom: "1px solid #1B2635" }}>· {ex}</div>
                          ))}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* ACHIEVEMENTS */}
                {tab === "achievements" && (
                  <div>
                    <div style={{ fontFamily: "'Cinzel',serif", fontSize: "13px", color: "#7A93A6", letterSpacing: "0.1em", marginBottom: "8px" }}>✦ DEEDS & HONOURS ✦</div>
                    <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "13px", color: "#465E75", marginBottom: "16px" }}>
                      {isAdmin
                        ? "Click an achievement to mark it as earned. XP is added automatically."
                        : "Achievements earned by each crew member during the campaign."}
                    </div>
                    {sorted.map(member => {
                      const data   = memberData[member.name] || { xp: 0, classId: null, achievements: [] };
                      const earned = data.achievements || [];
                      return (
                        <div key={member.name} style={{ marginBottom: "20px" }}>
                          <div style={{ fontFamily: "'Cinzel',serif", fontSize: "12px", color: "#58C7EB", letterSpacing: "0.06em", marginBottom: "8px", display: "flex", alignItems: "center", gap: "10px" }}>
                            {member.name}
                            <span style={{ fontSize: "10px", color: "#465E75" }}>{earned.length}/{ACHIEVEMENTS.length} unlocked</span>
                          </div>
                          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(220px,1fr))", gap: "6px" }}>
                            {ACHIEVEMENTS.map(ach => {
                              const isEarned = earned.includes(ach.id);
                              return (
                                <div key={ach.id}
                                  className={`ach-card ${isEarned ? "unlocked" : ""} ${isAdmin ? "clickable" : ""}`}
                                  onClick={() => isAdmin && toggleAchievement(member.name, ach.id)}
                                  style={{ opacity: isEarned ? 1 : 0.4 }}>
                                  <span style={{ fontSize: "20px", flexShrink: 0 }}>{ach.icon}</span>
                                  <div style={{ flex: 1 }}>
                                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "2px" }}>
                                      <span style={{ fontFamily: "'Cinzel',serif", fontSize: "11px", color: isEarned ? "#58C7EB" : "#7A93A6" }}>{ach.name}</span>
                                      <span style={{ fontFamily: "'Cinzel',serif", fontSize: "10px", color: rarityColor[ach.rarity], textTransform: "uppercase" }}>{ach.rarity}</span>
                                    </div>
                                    <div style={{ fontFamily: "'Crimson Text',serif", fontSize: "11px", color: "#465E75", lineHeight: "1.3" }}>{ach.desc}</div>
                                    {ach.xp > 0 && <div style={{ fontFamily: "'Cinzel',serif", fontSize: "10px", color: "#58C7EB", marginTop: "3px" }}>+{ach.xp} XP</div>}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    // ── MOUNT ────────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<LastCarRPG />);
  </script>
</body>
</html>
